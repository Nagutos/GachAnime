# GachAnime in production, from the images published by CI (ghcr.io), nothing to build.
# On the server, next to a filled `.env` (see .env.example):
#   docker compose -f docker-compose.prod.yml up -d
# Update: docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
# GACHANIME_VERSION picks the release: `latest` (default), `1.2`, `1.2.3`, or `edge` (main).
# Same services as docker-compose.yml (which builds from source): keep both in sync.
name: gachanime

x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-gachanime}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gachanime}
  REDIS_URL: redis://redis:6379
  PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
  DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?set DISCORD_CLIENT_ID}
  DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?set DISCORD_CLIENT_SECRET}
  ADMIN_DISCORD_IDS: ${ADMIN_DISCORD_IDS:-}
  IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
  IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  UPLOADS_DIR: /app/uploads

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: '3' }

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gachanime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gachanime}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: ${GACHANIME_IMAGES:-ghcr.io/nagutos/gachanime}-tools:${GACHANIME_VERSION:-latest}
    working_dir: /app/packages/db
    command: ['node', '--import', 'tsx', 'src/cli/migrate.ts']
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: ${GACHANIME_IMAGES:-ghcr.io/nagutos/gachanime}-api:${GACHANIME_VERSION:-latest}
    restart: unless-stopped
    logging: *logging
    environment: *app-env
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    image: ${GACHANIME_IMAGES:-ghcr.io/nagutos/gachanime}-tools:${GACHANIME_VERSION:-latest}
    restart: unless-stopped
    logging: *logging
    working_dir: /app/apps/worker
    command: ['node', '--import', 'tsx', 'src/main.ts']
    environment: *app-env
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    image: ${GACHANIME_IMAGES:-ghcr.io/nagutos/gachanime}-web:${GACHANIME_VERSION:-latest}
    restart: unless-stopped
    logging: *logging
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges}
    ports:
      - '${HTTP_PORT:-8080}:80'
      - '${HTTPS_PORT:-8443}:443'
    volumes:
      - uploads:/data/uploads:ro
      - caddy-data:/data/caddy
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  uploads:
  caddy-data:
