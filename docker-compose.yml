# Self-hosted GachAnime: `cp .env.example .env`, fill it, then `docker compose up -d`.
name: gachanime

x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-gachanime}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gachanime}
  REDIS_URL: redis://redis:6379
  PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
  DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?set DISCORD_CLIENT_ID}
  DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?set DISCORD_CLIENT_SECRET}
  ADMIN_DISCORD_IDS: ${ADMIN_DISCORD_IDS:-}
  IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
  IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  UPLOADS_DIR: /app/uploads

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gachanime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gachanime}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: { context: ., target: tools }
    image: gachanime-tools
    working_dir: /app/packages/db
    command: ['node', '--import', 'tsx', 'src/cli/migrate.ts']
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., target: api }
    image: gachanime-api
    restart: unless-stopped
    environment: *app-env
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    image: gachanime-tools
    restart: unless-stopped
    working_dir: /app/apps/worker
    command: ['node', '--import', 'tsx', 'src/main.ts']
    environment: *app-env
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build: { context: ., target: web }
    image: gachanime-web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - '${HTTP_PORT:-8080}:80'
      - '${HTTPS_PORT:-8443}:443'
    volumes:
      - uploads:/data/uploads:ro
      - caddy-data:/data/caddy
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  uploads:
  caddy-data:
