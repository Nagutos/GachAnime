name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gachanime
          POSTGRES_PASSWORD: gachanime
          POSTGRES_DB: gachanime_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gachanime" --health-interval 5s --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://gachanime:gachanime@localhost:5432/gachanime_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm i18n:check
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    # Player flows run against a real API with Postgres and Redis (see e2e/support/env.ts).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gachanime
          POSTGRES_PASSWORD: gachanime
          POSTGRES_DB: gachanime_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gachanime" --health-interval 5s --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://gachanime:gachanime@localhost:5432/gachanime_test
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-secret-for-e2e-sessions-0123456789
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gachanime/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --target api . && docker build --target tools . && docker build --target web .
