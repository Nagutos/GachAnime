name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gachanime
          POSTGRES_PASSWORD: gachanime
          POSTGRES_DB: gachanime_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gachanime" --health-interval 5s --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://gachanime:gachanime@localhost:5432/gachanime_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm i18n:check
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    # Player flows run against a real API with Postgres and Redis (see e2e/support/env.ts).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gachanime
          POSTGRES_PASSWORD: gachanime
          POSTGRES_DB: gachanime_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gachanime" --health-interval 5s --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://gachanime:gachanime@localhost:5432/gachanime_test
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-secret-for-e2e-sessions-0123456789
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gachanime/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  # Pull requests: the images must still build (nothing is pushed).
  docker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --target api . && docker build --target tools . && docker build --target web .

  # main and v* tags, once the checks and e2e pass: each image is built natively on x86_64 and
  # arm64 runners and pushed by digest, then `publish` joins both into one multi-arch tag.
  images:
    if: github.event_name == 'push'
    needs: [check, e2e]
    strategy:
      fail-fast: false
      matrix:
        target: [api, tools, web]
        platform:
          - { name: linux/amd64, runner: ubuntu-24.04, slug: amd64 }
          - { name: linux/arm64, runner: ubuntu-24.04-arm, slug: arm64 }
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Image name (GHCR needs a lowercase owner)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gachanime-${{ matrix.target }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform.name }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.platform.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.platform.slug }}
      - name: Keep the digest for publish
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.target }}-${{ matrix.platform.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: images
    strategy:
      matrix:
        target: [api, tools, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Image name (GHCR needs a lowercase owner)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gachanime-${{ matrix.target }}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.target }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # main → `edge` and `sha-<commit>`; tag v1.2.3 → `1.2.3`, `1.2`, `1` and `latest`.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - name: Multi-arch tags
        working-directory: /tmp/digests
        # Word splitting wanted: one `-t <tag>` and one image per digest.
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
